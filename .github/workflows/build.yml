name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Xcode environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project LiDARMeasure.xcodeproj \
            -scheme LiDARMeasure \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iphoneos Release
        run: |
          xcodebuild clean build \
            -project LiDARMeasure.xcodeproj \
            -scheme LiDARMeasure \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: bash ./Scripts/package_unsigned_ipa.sh build 0.1.0

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiDARMeasure-v0.1.0-unsigned-ipa
          path: artifacts/LiDARMeasure-v0.1.0-unsigned.ipa
          if-no-files-found: error
