name: Export CoreML Model

on:
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/export_model.py'
      - '.github/workflows/export-model.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          python3 --version
          python3 -m venv mlvenv
          ./mlvenv/bin/pip install --upgrade pip -q
          ./mlvenv/bin/pip install ultralytics "coremltools<9" -q

      - name: Export YOLO11n CoreML
        run: ./mlvenv/bin/python Scripts/export_model.py

      - name: Verify model output
        run: |
          ls -la ObjectDetector.mlpackage
          ./mlvenv/bin/python Scripts/inspect_model.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObjectDetector-mlpackage
          path: ObjectDetector.mlpackage
          if-no-files-found: error
