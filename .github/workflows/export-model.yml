name: Export YOLO26m-seg CoreML

on:
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/export_yolo26_seg.py'
      - 'Scripts/smoke_test_coreml_seg.py'
      - 'Scripts/test_coreml_output.py'
      - 'Scripts/ml-requirements.txt'
      - 'Tests/Fixtures/**'
      - '.github/workflows/export-model.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # runner 默认 Python 3.14 无 coremltools 二进制 wheel，固定 3.12。
          python-version: '3.12'

      - name: Install dependencies (locked)
        run: |
          python3 -m venv mlvenv
          ./mlvenv/bin/pip install --upgrade pip -q
          ./mlvenv/bin/pip install -r Scripts/ml-requirements.txt -q
          ./mlvenv/bin/python -c "import ultralytics, coremltools; print('ultralytics', ultralytics.__version__, '| coremltools', coremltools.__version__)"

      - name: Export YOLO26m-seg CoreML (+ INT8 comparison, l-seg benchmark)
        run: ./mlvenv/bin/python Scripts/export_yolo26_seg.py

      - name: Smoke test segmentation model
        run: |
          test -e ObjectSegmenter.mlpackage
          ./mlvenv/bin/python Scripts/smoke_test_coreml_seg.py ObjectSegmenter.mlpackage
          ./mlvenv/bin/python Scripts/test_coreml_output.py ObjectSegmenter.mlpackage Tests/Fixtures/coco_bus.jpg

      - name: Verify model output structure
        run: |
          ls -la ObjectSegmenter.mlpackage
          ./mlvenv/bin/python Scripts/inspect_model.py ObjectSegmenter.mlpackage

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObjectSegmenter-mlpackage
          path: ObjectSegmenter.mlpackage
          if-no-files-found: error

      - name: Upload l-seg benchmark artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ObjectSegmenter-L-mlpackage-benchmark
          path: ObjectSegmenter-L.mlpackage
          if-no-files-found: ignore
