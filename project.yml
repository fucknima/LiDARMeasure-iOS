name: LiDARMeasure

options:
  bundleIdPrefix: com.lidarmeasure
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  LiDARMeasure:
    type: application
    platform: iOS
    sources:
      - path: LiDARMeasure
        excludes:
          - Supporting/Info.plist
          - Supporting/Assets.xcassets
    resources:
      - path: LiDARMeasure/Supporting/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarmeasure.app
        INFOPLIST_FILE: LiDARMeasure/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - LiDARMeasureTests

  LiDARMeasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiDARMeasureTests
    dependencies:
      - target: LiDARMeasure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarmeasure.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiDARMeasure.app/LiDARMeasure"
        BUNDLE_LOADER: "$(TEST_HOST)"
